name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Тип сборки (release — для RuStore, debug — для проверки на телефоне)"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
  push:
    branches: [ main, master ]

jobs:
  debug:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'debug')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Сборка внутри официального образа kivy/buildozer.
      # Проблема: встроенный в образ buildozer старый python-for-android (2022)
      # делает в venv «pip install -U pip», а свежая pip 26.x при апгрейте
      # оставляет смешанное состояние (новый installer.py + старый exceptions.py)
      # и падает с ImportError: BuildDependencyInstallError. Это исправлено
      # в p4a (develop) отказом от self-upgrade. Поэтому после «android update»
      # патчим локальный p4a той же правкой (заменяем апгрейд pip на no-op «true»),
      # затем собираем APK.
      - name: Build debug APK
        run: |
          docker pull kivy/buildozer:latest
          docker run --rm \
            -v "${{ github.workspace }}":/app \
            -w /app \
            --entrypoint /bin/bash \
            kivy/buildozer:latest \
            -c "buildozer android update && sed -i 's/source venv\/bin\/activate && pip install -U pip/true/' /app/.buildozer/android/platform/python-for-android/pythonforandroid/build.py && buildozer android debug"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kipiacalc-debug-apk
          path: bin/*.apk

  # Подписанная release-сборка (APK для RuStore и прямой установки).
  # Запускается вручную: Actions → Build APK → Run workflow → выбрать release.
  # Ключ и пароли должны быть заданы в Secrets репозитория:
  #   P4A_RELEASE_KEYSTORE        — содержимое keystore (base64)
  #   P4A_RELEASE_KEYSTORE_PASSWD — пароль хранилища
  #   P4A_RELEASE_KEYALIAS        — алиас ключа
  #   P4A_RELEASE_KEYALIAS_PASSWD — пароль ключа
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode keystore
        env:
          P4A_RELEASE_KEYSTORE_B64: ${{ secrets.P4A_RELEASE_KEYSTORE }}
        run: |
          echo "$P4A_RELEASE_KEYSTORE_B64" | base64 -d > keystore.keystore

      - name: Build signed release APK
        env:
          P4A_RELEASE_KEYSTORE: /app/keystore.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.P4A_RELEASE_KEYSTORE_PASSWD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.P4A_RELEASE_KEYALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.P4A_RELEASE_KEYALIAS_PASSWD }}
        run: |
          docker pull kivy/buildozer:latest
          docker run --rm \
            -v "${{ github.workspace }}":/app \
            -w /app \
            --entrypoint /bin/bash \
            -e P4A_RELEASE_KEYSTORE \
            -e P4A_RELEASE_KEYSTORE_PASSWD \
            -e P4A_RELEASE_KEYALIAS \
            -e P4A_RELEASE_KEYALIAS_PASSWD \
            kivy/buildozer:latest \
            -c "buildozer android update && sed -i 's/source venv\/bin\/activate && pip install -U pip/true/' /app/.buildozer/android/platform/python-for-android/pythonforandroid/build.py && buildozer android release"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: kipiacalc-release-apk
          path: bin/*.apk