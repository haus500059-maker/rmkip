name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Сборка внутри официального образа kivy/buildozer:
      # команда Kivy держит в нём совместимый набор buildozer + python-for-android + NDK,
      # это убирает ошибки «пляски версий» на хост-окружении.
      - name: Build debug APK
        run: |
          docker pull kivy/buildozer:latest
          # Переопределяем entrypoint, чтобы сначала починить битый pip базового окружения
          # (иначе p4a падает в venv с ImportError: BuildDependencyInstallError),
          # затем запускаем штатную сборку.
          docker run --rm \
            -v "${{ github.workspace }}":/app \
            -w /app \
            --entrypoint /bin/bash \
            kivy/buildozer:latest \
            -c "python -m ensurepip --upgrade --default-pip && buildozer android debug"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kipiacalc-debug-apk
          path: bin/*.apk