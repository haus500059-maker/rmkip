name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Сборка внутри официального образа kivy/buildozer.
      # Проблема: встроенный в образ buildozer старый python-for-android (2022)
      # делает в venv «pip install -U pip», а свежая pip 26.x при апгрейте
      # оставляет смешанное состояние (новый installer.py + старый exceptions.py)
      # и падает с ImportError: BuildDependencyInstallError. Это исправлено
      # в p4a (develop) отказом от self-upgrade. Поэтому после «android update»
      # патчим локальный p4a той же правкой (заменяем апгрейд pip на no-op «true»),
      # затем собираем APK.
      - name: Build debug APK
        run: |
          docker pull kivy/buildozer:latest
          docker run --rm \
            -v "${{ github.workspace }}":/app \
            -w /app \
            --entrypoint /bin/bash \
            kivy/buildozer:latest \
            -c "buildozer android update && sed -i 's/source venv\/bin\/activate && pip install -U pip/true/' /app/.buildozer/android/platform/python-for-android/pythonforandroid/build.py && buildozer android debug"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kipiacalc-debug-apk
          path: bin/*.apk