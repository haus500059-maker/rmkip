name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip wget openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev \
            libffi-dev libssl-dev python3-pip python3-setuptools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install buildozer
        run: |
          pip3 install --upgrade buildozer Cython virtualenv

      - name: Build debug APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kipiacalc-debug-apk
          path: bin/*.apk