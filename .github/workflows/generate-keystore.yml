name: Generate keystore

# Создаёт keystore ключом разработчика на виртуальной машине GitHub,
# загружает сам файл как артефакт и печатает параметры для GitHub Secrets.
# Запуск: Actions → Generate keystore → Run workflow → ввести пароли и алиас.
on:
  workflow_dispatch:
    inputs:
      store_pass:
        description: "Пароль хранилища (keystore password, мин. 6 символов)"
        required: true
      key_pass:
        description: "Пароль ключа (можно такой же, как пароль хранилища)"
        required: true
      alias:
        description: "Алиас ключа (понадобится в Secrets)"
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "${{ github.event.inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.store_pass }}" \
            -keypass "${{ github.event.inputs.key_pass }}" \
            -dname "CN=KIPiA Calc, OU=KIPiA, O=KIPiA, L=Moscow, ST=Moscow, C=RU"

      - name: Show base64 of keystore
        run: |
          base64 -w0 release.keystore

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.keystore